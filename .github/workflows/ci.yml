name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built page must not name any other host in its policy, scripts or styles
        run: |
          grep -q "connect-src 'none'" dist/index.html
          ! grep -rEoh "(src|href)=\"https?://[^\"]+\.(js|css|woff2?)\"" dist/index.html
          ! grep -rEl "fetch\(|XMLHttpRequest|sendBeacon|WebSocket|EventSource" dist/assets/*.js
