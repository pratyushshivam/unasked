name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built page may contact one named address, once, and nothing else
        run: |
          grep -q "connect-src https://ipinfo.io;" dist/index.html
          test "$(grep -o "fetch(" dist/assets/*.js | wc -l)" -eq 1
          ! grep -E "XMLHttpRequest|sendBeacon|WebSocket|EventSource" dist/assets/*.js
          ! grep -oE "https?://[a-zA-Z0-9./-]+" dist/assets/*.js | grep -vE "w3.org|gsap.com|ipinfo.io/json"
